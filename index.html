
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathogen Detective</title>

<style>
* { box-sizing: border-box; }

<body>

  <header>
  <h1>Pathogen Detective</h1>
  <p class="subtitle">
  16 suspects. One culprit. Solve the mystery.
  </p>
  </header>
  
  {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102630;
  color: #f3f7f5;
  text-align: center;
}

header {
  padding: 25px 12px;
  background: #183b43;
  border-bottom: 3px solid #d8b65c;
}

h1 {
  color: #e8c86d;
  letter-spacing: 3px;
  margin: 5px;
}

.subtitle { color: #c1d4d1; }

button, select {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  font-weight: bold;
}

.primary {
  background: #e8c86d;
  color: #142d35;
  font-size: 18px;
  padding: 16px 35px;
}

.primary:hover { background: #f6dc91; }

.panel {
  background: #1b3943;
  border: 1px solid #42616a;
  border-radius: 13px;
  padding: 18px;
  margin: 18px auto;
  max-width: 950px;
  width: 94%;
}
