
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathogen Detective</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #102630;
  color: #f3f7f5;
  text-align: center;
}

header {
  padding: 25px 12px;
  background: #183b43;
  border-bottom: 3px solid #d8b65c;
}

h1 {
  color: #e8c86d;
  letter-spacing: 3px;
  margin: 5px;
}

.subtitle { color: #c1d4d1; }

button, select {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  font-weight: bold;
}

.primary {
  background: #e8c86d;
  color: #142d35;
  font-size: 18px;
  padding: 16px 35px;
}

.primary:hover { background: #f6dc91; }

.panel {
  background: #1b3943;
  border: 1px solid #42616a;
  border-radius: 13px;
  padding: 18px;
  margin: 18px auto;
  max-width: 950px;
  width: 94%;
}

#game { display: none; }

.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  max-width: 950px;
  width: 94%;
  margin: 20px auto;
}

.card {
  background: #e6f0ed;
  color: #19343b;
  min-height: 120px;
  padding: 10px 5px;
  border: 3px solid transparent;
  transition: 0.2s;
}

.card:hover {
  border-color: #e8c86d;
  transform: translateY(-3px);
}

.card .emoji {
  display: block;
  font-size: 30px;
  margin-bottom: 8px;
}

.card small {
  display: block;
  font-weight: normal;
  margin-top: 5px;
}

.card.eliminated {
  opacity: 0.25;
  filter: grayscale(1);
  text-decoration: line-through;
}

.questions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.question {
  background: #d8e7e2;
  color: #17353d;
}

.question:disabled {
  opacity: 0.3;
  cursor: default;
}

#answer {
  color: #f2d47c;
  font-weight: bold;
  margin: 15px;
  min-height: 24px;
}

#result {
  display: none;
  border: 2px solid #e8c86d;
}

select {
  background: #e6f0ed;
  color: #19343b;
  margin: 8px;
  max-width: 95%;
}

footer {
  padding: 25px;
  color: #9bb4b3;
  font-size: 12px;
}

@media(max-width: 550px) {
  .board { gap: 6px; }
  .card { min-height: 105px; font-size: 11px; }
  .card .emoji { font-size: 24px; }
}
